services:
  app-ubmager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubmager_app
    restart: unless-stopped
    working_dir: /var/www/UBMagerAPI
    env_file:
      - ./.env
    volumes:
      - ./storage:/var/www/UBMagerAPI/storage
      - ./bootstrap/cache:/var/www/UBMagerAPI/bootstrap/cache

    networks:
      - shared-network
  web-ubmager:
    image: nginx:alpine
    container_name: ubmager_web
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=api.ubmager.shop
      - LETSENCRYPT_HOST=api.ubmager.shop
      - LETSENCRYPT_EMAIL=ahmadfauzanroziqin@gmail.com
    volumes:
      - .:/var/www/UBMagerAPI
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-ubmager
    networks:
      - shared-network

networks:
  shared-network:
    external: true