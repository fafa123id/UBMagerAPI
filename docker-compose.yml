services:
  app-ubmager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubmager_app
    restart: unless-stopped
    working_dir: /var/www/UBMagerAPI
    env_file:
      - ./.env
    environment:
      - VIRTUAL_PORT=9000
      - VIRTUAL_HOST=api.ubmager.bornhub.cloud
      - LETSENCRYPT_HOST=api.ubmager.bornhub.cloud
      - LETSENCRYPT_EMAIL=ahmadfauzanroziqin@gmail.com
    volumes:
      - laravel_storage:/var/www/UBMagerAPI/storage
      - laravel_cache:/var/www/UBMagerAPI/bootstrap/cache
    networks:
      - shared-network
